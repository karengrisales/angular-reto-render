<article
  class="product-card"
  [attr.aria-label]="product().name"
>
  <a
    class="product-card__link"
    [routerLink]="['/producto', product().slug]"
    (click)="cardClicked.emit(product())"
  >
    <!-- Image container -->
    <div class="product-card__image-wrap">
      @if (coverImage) {
        <img
          class="product-card__image"
          [ngSrc]="coverImage.url"
          [alt]="coverImage.alt"
          [width]="coverImage.width"
          [height]="coverImage.height"
          [priority]="priority()"
          sizes="(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 25vw"
        />
      } @else {
        <div class="product-card__placeholder" aria-hidden="true"></div>
      }

      <!-- Favorite button -->
      <button
        class="product-card__fav"
        type="button"
        [attr.aria-label]="isFav() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        [attr.aria-pressed]="isFav()"
        (click)="toggleFavorite($event)"
      >
        @if (isFav()) {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        } @else {
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        }
      </button>

      @if (product().featured) {
        <app-badge class="product-card__badge" variant="primary">Destacado</app-badge>
      }
    </div>

    <!-- Info -->
    <div class="product-card__info">
      <app-badge variant="surface">{{ product().categoryName }}</app-badge>
      <h3 class="product-card__name">{{ product().name }}</h3>
      @if (product().description) {
        <p class="product-card__desc">{{ product().description }}</p>
      }
    </div>
  </a>
</article>
